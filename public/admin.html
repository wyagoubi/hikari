<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Hikari Studio — Owner</title><link rel="icon" href="/assets/logo-sm.webp">
<style>
:root{--bg:#0D0614;--deep:#1A0B2E;--sec:#28103B;--neb:#542477;--lav:#B58AC9;--rose:#C58A91;--gold:#D9B77E;--tx:#F7EDF7;--tx2:#CBB9D3}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.6 Tajawal,'Segoe UI',system-ui,sans-serif}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--deep);border-bottom:1px solid rgba(197,138,145,.4);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top img{width:36px;border-radius:50%}.top b{margin-inline-end:auto}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid rgba(197,138,145,.2)}
nav button,.b{background:var(--sec);border:1px solid rgba(197,138,145,.4);color:var(--tx);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit;min-height:38px}
nav button[aria-pressed=true]{background:var(--neb);border-color:var(--gold)}.b.p{background:var(--neb);border-color:var(--gold)}.b.d{border-color:#e66;color:#f99}.b:disabled{opacity:.5}
main{padding:18px;max-width:1200px;margin:auto}h2{margin:6px 0 14px;color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.k{background:var(--deep);border:1px solid rgba(197,138,145,.35);border-radius:12px;padding:14px}.k b{display:block;font-size:1.7rem;color:var(--gold)}.k span{color:var(--tx2);font-size:.9rem}
.box{background:var(--deep);border:1px solid rgba(197,138,145,.35);border-radius:12px;padding:14px;margin-bottom:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:8px 10px;text-align:start;border-bottom:1px solid rgba(197,138,145,.2);vertical-align:top}th{color:var(--tx2);font-weight:500}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid rgba(197,138,145,.45);border-radius:8px;padding:8px 10px;font:inherit}textarea{min-height:90px}
label{display:block;margin:10px 0 4px;color:var(--tx2);font-size:.9rem}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}.chk{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}.chk label{display:flex;gap:6px;align-items:center;margin:0;color:var(--tx)}.chk input{width:auto}
.imgs{display:flex;gap:10px;flex-wrap:wrap}.im{width:128px;background:var(--bg);border:1px solid rgba(197,138,145,.35);border-radius:8px;padding:6px;font-size:.8rem}.im img{width:100%;height:100px;object-fit:cover;border-radius:6px}.im.main{border-color:var(--gold)}.im div{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}.im button{padding:2px 7px;min-height:28px;font-size:.8rem}
.msg{position:fixed;bottom:16px;inset-inline:0;margin:auto;width:fit-content;max-width:92vw;padding:10px 20px;border-radius:10px;background:var(--sec);border:1px solid var(--gold);z-index:9}.msg.e{border-color:#e66}
.login{max-width:380px;margin:12vh auto;padding:0 18px}.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tb input,.tb select{width:auto;flex:1;min-width:140px}
a{color:var(--lav)}.refs{display:flex;gap:6px;flex-wrap:wrap}.refs img{width:84px;height:84px;object-fit:cover;border-radius:6px;cursor:zoom-in}
</style></head><body><div id="app"></div>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H={'X-Hikari':'1'};
const api=async(u,o={})=>{const r=await fetch('/api/admin'+u,{...o,headers:{...H,...(o.json?{'Content-Type':'application/json'}:{}),...(o.headers||{})},body:o.json?JSON.stringify(o.json):o.body,method:o.method||(o.json||o.body?'POST':'GET')});
 const j=await r.json().catch(()=>({}));if(r.status===401){login();throw new Error('unauthorized')}if(!r.ok)throw new Error(j.error||'error');return j};
const msg=(m,e)=>{const d=document.createElement('div');d.className='msg'+(e?' e':'');d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2600)};
const act=async(f,ok='تم الحفظ ✓')=>{try{await f();msg(ok)}catch(e){if(e.message!=='unauthorized')msg('خطأ: '+e.message,1)}};
const A=$('#app');let tab='overview';
const ST={new:'جديد',confirmed:'مؤكد',shipped:'تم الشحن',delivered:'تم التسليم',cancelled:'ملغى'},CST={new:'جديد',reviewing:'قيد المراجعة',quoted:'تم عرض سعر',accepted:'مقبول',declined:'مرفوض',done:'منجز'};
const opt=(o,v)=>Object.entries(o).map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${l}</option>`).join('');
function login(){A.innerHTML=`<form class="login box" id="lf"><h2>لوحة المالك</h2><label>البريد الإلكتروني</label><input name="email" type="email" required autocomplete="username"><label>كلمة المرور</label><input name="password" type="password" required autocomplete="current-password"><p id="le" style="color:#f99;min-height:1.4em"></p><button class="b p" style="width:100%">دخول</button></form>`;
 $('#lf').onsubmit=async e=>{e.preventDefault();try{await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}).then(async r=>{if(!r.ok)throw new Error((await r.json()).error);});shell()}catch(x){$('#le').textContent=x.message==='too_many'?'محاولات كثيرة، انتظر قليلًا':'بيانات الدخول غير صحيحة'}}}
const TABS={overview:'نظرة عامة',orders:'الطلبات',products:'المنتجات',custom:'الطلبات المخصصة',reviews:'الآراء',delivery:'التوصيل',settings:'الإعدادات'};
function shell(){A.innerHTML=`<div class="top"><img src="/assets/logo-sm.webp" alt=""><b>Hikari Studio — المالك</b><a href="/" target="_blank">المتجر</a><button class="b" id="lo">خروج</button></div><nav>${Object.entries(TABS).map(([k,l])=>`<button data-t="${k}" aria-pressed="${k===tab}">${l}</button>`).join('')}</nav><main id="m"></main>`;
 $$('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;$$('nav button').forEach(x=>x.setAttribute('aria-pressed',x===b));V[tab]()});
 $('#lo').onclick=async()=>{await api('/logout',{method:'POST'}).catch(()=>{});login()};V[tab]()}
const M=()=>$('#m');
const V={
async overview(){const s=await api('/stats');M().innerHTML=`<h2>نظرة عامة</h2><div class="cards">${[['الطلبات',s.orders],['طلبات جديدة',s.newOrders],['المنتجات',s.products],['طلبات مخصصة جديدة',s.custom],['آراء بانتظار المراجعة',s.reviews],['إيرادات (مسلّمة)',s.revenue.toLocaleString()+' DA']].map(([l,v])=>`<div class="k"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
 <div class="box"><h3>آخر الطلبات</h3><div class="tw"><table><tr><th>#</th><th>الاسم</th><th>المجموع</th><th>الحالة</th><th>التاريخ</th></tr>${s.recent.map(o=>`<tr><td>${o.id}</td><td>${esc(o.name)}</td><td>${o.total}</td><td>${ST[o.status]}</td><td>${esc(o.created_at)}</td></tr>`).join('')||'<tr><td colspan=5>لا توجد طلبات</td></tr>'}</table></div></div>`},
async orders(){const all=await api('/orders');const draw=()=>{const q=$('#oq').value.toLowerCase(),f=$('#of').value;
 $('#ol').innerHTML=all.filter(o=>(!f||o.status===f)&&(!q||(o.name+o.phone+o.id).toLowerCase().includes(q))).map(o=>`<div class="box"><b>#${o.id}</b> — ${esc(o.name)} — <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a> ${o.email?'— '+esc(o.email):''}<br>${esc(o.wilaya||'')} · ${o.delivery_type==='home'?'منزل':'مكتب'} ${o.address?'· '+esc(o.address):''}<br>
 <small>${o.items.map(i=>`${esc(i.name)} ×${i.qty} (${i.price})`).join(' | ')}</small><br>${o.note?`<small>ملاحظات: ${esc(o.note)}</small><br>`:''}المجموع ${o.subtotal} + توصيل ${o.delivery_fee} = <b>${o.total} DA</b> · ${esc(o.created_at)}
 <br><select data-o="${o.id}" style="width:auto;margin-top:8px">${opt(ST,o.status)}</select></div>`).join('')||'<div class="box">لا توجد طلبات</div>';
 $$('[data-o]').forEach(s=>s.onchange=()=>act(async()=>{await api('/orders/'+s.dataset.o,{method:'PUT',json:{status:s.value}});all.find(o=>o.id==s.dataset.o).status=s.value}))};
 M().innerHTML=`<h2>الطلبات</h2><div class="tb"><input id="oq" placeholder="بحث بالاسم/الهاتف/الرقم"><select id="of"><option value="">كل الحالات</option>${opt(ST)}</select></div><div id="ol"></div>`;$('#oq').oninput=draw;$('#of').onchange=draw;draw()},
async products(id){const [ps,cats]=await Promise.all([api('/products'),fetch('/api/categories').then(r=>r.json())]);
 M().innerHTML=`<h2>المنتجات</h2><button class="b p" id="np">+ منتج جديد</button><div class="tw box" style="margin-top:12px"><table><tr><th></th><th>الاسم</th><th>السعر</th><th>المخزون</th><th>الحالة</th><th></th></tr>${ps.map(p=>`<tr><td>${p.images[0]?`<img src="${esc(p.images[0].url)}" width="44" height="44" style="object-fit:cover;border-radius:6px" alt="">`:''}</td><td>${esc(p.name)}</td><td>${p.price}</td><td>${p.stock??'∞'}</td><td>${p.published?'منشور':'مخفي'}${p.available?'':' · غير متاح'}</td><td><button class="b" data-e="${p.id}">تعديل</button></td></tr>`).join('')||'<tr><td colspan=6>لا توجد منتجات بعد</td></tr>'}</table></div><div id="pf"></div>`;
 const form=p=>{p=p||{name:'',description:'',materials:'',dimensions:'',production_time:'',price:'',stock:null,available:1,published:0,customizable:0,video_url:'',category:'books',images:[]};
 $('#pf').innerHTML=`<form class="box" id="f"><h3>${p.id?'تعديل: '+esc(p.name):'منتج جديد'}</h3><div class="g2"><div><label>الاسم</label><input name="name" required value="${esc(p.name)}"></div><div><label>القسم</label><select name="category">${cats.map(c=>`<option value="${c.slug}" ${c.slug===p.category?'selected':''}>${esc(c.name_ar)}</option>`).join('')}</select></div>
 <div><label>السعر (DA)</label><input name="price" type="number" min="0" required value="${esc(p.price)}"></div><div><label>المخزون (فارغ = يُصنع عند الطلب)</label><input name="stock" type="number" min="0" value="${p.stock??''}"></div>
 <div><label>المواد</label><input name="materials" value="${esc(p.materials)}"></div><div><label>الأبعاد</label><input name="dimensions" value="${esc(p.dimensions)}"></div><div><label>مدة التحضير</label><input name="production_time" value="${esc(p.production_time)}"></div><div><label>رابط فيديو (https)</label><input name="video_url" value="${esc(p.video_url)}"></div></div>
 <label>الوصف</label><textarea name="description">${esc(p.description)}</textarea><div class="chk"><label><input type="checkbox" name="published" ${p.published?'checked':''}> منشور</label><label><input type="checkbox" name="available" ${p.available?'checked':''}> متاح للشراء</label><label><input type="checkbox" name="customizable" ${p.customizable?'checked':''}> قابل للتخصيص</label></div>
 <button class="b p">حفظ</button> ${p.id?'<button type="button" class="b d" id="del">حذف</button>':''} <button type="button" class="b" id="cx">إغلاق</button>
 ${p.id?`<h3 style="margin-top:18px">الصور</h3><div class="imgs">${p.images.map((i,n)=>`<div class="im ${i.is_main?'main':''}"><img src="${esc(i.url)}" alt=""><div><button type="button" class="b" data-m="${i.id}" ${i.is_main?'disabled':''}>رئيسية</button><button type="button" class="b" data-mv="${i.id}:-1" ${n==0?'disabled':''}>→</button><button type="button" class="b" data-mv="${i.id}:1" ${n==p.images.length-1?'disabled':''}>←</button><button type="button" class="b d" data-d="${i.id}">✕</button></div></div>`).join('')||'<small>لا توجد صور</small>'}</div><label>رفع صور (JPG/PNG/WEBP، 6MB)</label><input type="file" id="up" accept="image/jpeg,image/png,image/webp" multiple>`:'<small>احفظ المنتج أولًا ثم أضف الصور.</small>'}</form>`;
 $('#cx').onclick=()=>$('#pf').innerHTML='';
 $('#f').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));['published','available','customizable'].forEach(k=>d[k]=e.target[k].checked);
  act(async()=>{const r=await api(p.id?'/products/'+p.id:'/products',{method:p.id?'PUT':'POST',json:d});await V.products();if(!p.id)edit(r.id)})};
 if(p.id){$('#del').onclick=()=>confirm('حذف المنتج نهائيًا؟')&&act(async()=>{await api('/products/'+p.id,{method:'DELETE'});V.products()});
  const re=()=>act(async()=>{},'تم').then(async()=>{await V.products();edit(p.id)});
  $$('[data-m]').forEach(b=>b.onclick=()=>act(()=>api('/images/'+b.dataset.m+'/main',{method:'POST',json:{}})).then(re));
  $$('[data-mv]').forEach(b=>b.onclick=()=>{const[i,d]=b.dataset.mv.split(':');act(()=>api('/images/'+i+'/move',{method:'POST',json:{dir:+d}})).then(re)});
  $$('[data-d]').forEach(b=>b.onclick=()=>confirm('حذف الصورة؟')&&act(()=>api('/images/'+b.dataset.d,{method:'DELETE'})).then(re));
  $('#up').onchange=e=>{const fd=new FormData();[...e.target.files].forEach(f=>fd.append('images',f));act(()=>api('/products/'+p.id+'/images',{method:'POST',body:fd}),'تم الرفع ✓').then(re)}}
 $('#pf').scrollIntoView({behavior:'smooth'})};
 const edit=i=>form(ps.find(p=>p.id==i)||null);$('#np').onclick=()=>form();$$('[data-e]').forEach(b=>b.onclick=()=>edit(b.dataset.e));if(id)edit(id)},
async custom(){const all=await api('/custom');M().innerHTML=`<h2>الطلبات المخصصة</h2>`+(all.map(c=>`<div class="box"><b>#${c.id}</b> — ${esc(c.name)} — <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a> ${c.email?'— '+esc(c.email):''}<br><small>النوع: ${esc(c.type)} · الميزانية: ${esc(c.budget||'—')} · الألوان: ${esc(c.colors||'—')} · ${esc(c.created_at)}</small><p style="white-space:pre-line;margin:8px 0">${esc(c.description)}</p>
 ${c.links?`<small>روابط: ${esc(c.links)}</small><br>`:''}<div class="refs" style="margin:8px 0">${c.files.map(f=>`<a href="${esc(f.url)}" target="_blank"><img src="${esc(f.url)}" alt="مرجع" loading="lazy"></a>`).join('')}</div><select data-c="${c.id}" style="width:auto">${opt(CST,c.status)}</select></div>`).join('')||'<div class="box">لا توجد طلبات</div>');
 $$('[data-c]').forEach(s=>s.onchange=()=>act(()=>api('/custom/'+s.dataset.c,{method:'PUT',json:{status:s.value}})))},
async reviews(){const all=await api('/reviews');M().innerHTML=`<h2>الآراء</h2>`+(all.map(r=>`<div class="box"><b>${esc(r.author)}</b> ${esc(r.city)} — ${'★'.repeat(r.rating)}<p>${esc(r.text)}</p><button class="b ${r.approved?'':'p'}" data-a="${r.id}:${r.approved?0:1}">${r.approved?'إخفاء':'نشر'}</button> <button class="b d" data-r="${r.id}">حذف</button></div>`).join('')||'<div class="box">لا توجد آراء</div>');
 $$('[data-a]').forEach(b=>b.onclick=()=>{const[i,a]=b.dataset.a.split(':');act(()=>api('/reviews/'+i,{method:'PUT',json:{approved:+a}})).then(V.reviews)});$$('[data-r]').forEach(b=>b.onclick=()=>confirm('حذف؟')&&act(()=>api('/reviews/'+b.dataset.r,{method:'DELETE'})).then(V.reviews))},
async delivery(){const w=await api('/wilayas');M().innerHTML=`<h2>رسوم التوصيل</h2><p style="color:var(--tx2);margin-bottom:10px">اترك الخانة فارغة إذا كانت الطريقة غير متاحة للولاية. لن يتمكن الزبون من الطلب لها.</p><div class="box tw"><table><tr><th>الولاية</th><th>المنزل</th><th>المكتب</th><th></th></tr>${w.map(x=>`<tr><td>${x.code} — ${esc(x.name)}</td><td><input type="number" min="0" data-h="${x.code}" value="${x.fee_home??''}"></td><td><input type="number" min="0" data-o="${x.code}" value="${x.fee_office??''}"></td><td><button class="b" data-s="${x.code}">حفظ</button></td></tr>`).join('')}</table></div>`;
 $$('[data-s]').forEach(b=>b.onclick=()=>act(()=>api('/wilayas/'+b.dataset.s,{method:'PUT',json:{fee_home:$(`[data-h="${b.dataset.s}"]`).value,fee_office:$(`[data-o="${b.dataset.s}"]`).value}})))},
async settings(){const s=await fetch('/api/settings').then(r=>r.json());M().innerHTML=`<h2>روابط التواصل</h2><form class="box" id="sf" style="max-width:520px"><p style="color:var(--tx2)">أدخل الروابط الحقيقية (https). الفارغة لن تظهر في المتجر.</p>${['instagram','tiktok','youtube','facebook'].map(k=>`<label>${k}</label><input name="${k}" type="url" placeholder="https://" value="${esc(s[k])}">`).join('')}<br><button class="b p">حفظ</button></form>`;
 $('#sf').onsubmit=e=>{e.preventDefault();act(()=>api('/settings',{method:'PUT',json:Object.fromEntries(new FormData(e.target))}))}}};
api('/me').then(shell).catch(login);
</script></body></html>
